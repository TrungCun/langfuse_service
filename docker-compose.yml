# Adapted from langfuse/langfuse v4.50.0 docker-compose.yml.
# Upstream: https://github.com/langfuse/langfuse/blob/v4.50.0/docker-compose.yml
# Local changes: pinned Langfuse release, required secrets, LAN web/media,
# internal-only databases, healthchecks, Redis AOF and bounded container logs.
name: langfuse-service

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env to the LAN URL}
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:?Run python scripts/init_env.py}@postgres:5432/langfuse
  SALT: ${SALT:?Run python scripts/init_env.py}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run python scripts/init_env.py}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run python scripts/init_env.py}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?Run python scripts/init_env.py}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run python scripts/init_env.py}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run python scripts/init_env.py}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

services:
  langfuse-web:
    <<: *runtime
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_VERSION:-4.50.0}
    depends_on: *dependencies
    ports:
      - "0.0.0.0:${WEB_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run python scripts/init_env.py}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${MEDIA_PUBLIC_URL:?Set MEDIA_PUBLIC_URL in .env to the LAN URL}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  langfuse-worker:
    <<: *runtime
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_VERSION:-4.50.0}
    depends_on: *dependencies
    ports:
      - "127.0.0.1:${WORKER_PORT:-3030}:3030"
    environment: *langfuse-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    <<: *runtime
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.12}
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run python scripts/init_env.py}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config/clickhouse-logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *runtime
    image: ${REDIS_IMAGE:-redis:7}
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?Run python scripts/init_env.py}
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?Run python scripts/init_env.py}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_AUTH\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    <<: *runtime
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    entrypoint: sh
    # Same bucket bootstrap method as upstream Langfuse Compose.
    command: ["-c", "mkdir -p /data/langfuse && exec minio server --address ':9000' --console-address ':9001' /data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python scripts/init_env.py}
    ports:
      - "0.0.0.0:${MINIO_PORT:-9095}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9096}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:
